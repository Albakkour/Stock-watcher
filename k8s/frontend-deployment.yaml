apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-stock-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: gitlab.control.lth.se:5050/regler/frtn90/2025/agroup01/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE
              value: "http://129.192.82.232:30081"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloud-stock-watcher
spec:
  type: NodePort    
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080  
