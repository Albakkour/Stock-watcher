stages:
  - build
  - deploy

variables:
  REGISTRY: "gitlab.control.lth.se:5050"
  IMAGE_NAME: "regler/frtn90/2025/agroup01"

  # # Use GitLab’s Docker Hub mirror → avoids all rate limits
  # NODE_BASE: "registry.gitlab.control.lth.se/library/node:20-alpine" 
  # NGINX_BASE: "registry.gitlab.control.lth.se/library/nginx:alpine"

.default_build: &default_build
  stage: build
  image: docker:latest
  tags:
    - docker
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  only:
    - main
    - Stock-watch-v2
    


build:stock-generator:
  <<: *default_build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$IMAGE_NAME/stock-generator:$CI_COMMIT_SHA stock-generator/
    - docker push $REGISTRY/$IMAGE_NAME/stock-generator:$CI_COMMIT_SHA

build:alert-engine:
  <<: *default_build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$IMAGE_NAME/alert-engine:$CI_COMMIT_SHA alert-engine/
    - docker push $REGISTRY/$IMAGE_NAME/alert-engine:$CI_COMMIT_SHA

build:backend-api:
  <<: *default_build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$IMAGE_NAME/backend-api:$CI_COMMIT_SHA backend-api/
    - docker push $REGISTRY/$IMAGE_NAME/backend-api:$CI_COMMIT_SHA

build:frontend:
  <<: *default_build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY

    # # Patch Dockerfile at build time → replaces node:20-alpine & nginx:alpine
    # - |
    #   sed -i "s|FROM node:20-alpine|FROM $NODE_BASE|g" frontend/Dockerfile
    #   sed -i "s|FROM nginx:alpine|FROM $NGINX_BASE|g" frontend/Dockerfile

    - docker build -t $REGISTRY/$IMAGE_NAME/frontend:$CI_COMMIT_SHA frontend/
    - docker push $REGISTRY/$IMAGE_NAME/frontend:$CI_COMMIT_SHA

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  only:
    - main
    - Stock-watch-v2
  script:
    - kubectl set image deployment/stock-generator stock-generator=$REGISTRY/$IMAGE_NAME/stock-generator:$CI_COMMIT_SHA -n cloud-stock-watcher
    - kubectl set image deployment/alert-engine alert-engine=$REGISTRY/$IMAGE_NAME/alert-engine:$CI_COMMIT_SHA -n cloud-stock-watcher
    - kubectl set image deployment/backend-api backend-api=$REGISTRY/$IMAGE_NAME/backend-api:$CI_COMMIT_SHA -n cloud-stock-watcher
    - kubectl set image deployment/frontend frontend=$REGISTRY/$IMAGE_NAME/frontend:$CI_COMMIT_SHA -n cloud-stock-watcher
    - kubectl rollout status deployment/stock-generator -n cloud-stock-watcher
    - kubectl rollout status deployment/alert-engine -n cloud-stock-watcher
    - kubectl rollout status deployment/backend-api -n cloud-stock-watcher
    - kubectl rollout status deployment/frontend -n cloud-stock-watcher




